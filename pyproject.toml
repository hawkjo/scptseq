[project]
name = "scptseq"
dynamic = ["version"]
description = "scPT-seq preprocessing package"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "John Hawkins", email = "hawkjo@gmail.com"}]
keywords = ["DNA", "RNA", "CRISPR", "NGS", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20.0",
    "docopt>=0.6.2",
    "biopython>=1.79",
    "matplotlib>=3.5.2",
    "pysam>=0.22.1",
    "statsmodels>=0.14.4",
    "editdistance",
    "pyyaml>=6.0",
    "scipy>=1.7",
]

[project.scripts]
scptseq = "scptseq.main:main"

[project.urls]
Homepage = "https://github.com/hawkjo/scptseq"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scptseq"]

[tool.setuptools.dynamic]
version = {attr = "scptseq.__version__"}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that run the full pipeline (deselect with '-m \"not slow\"')",
]
